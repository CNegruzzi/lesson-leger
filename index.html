<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesson Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --board: #263A33;
    --board-2: #30463D;
    --paper: #EDE6D3;
    --paper-2: #F5F0E3;
    --ink: #23282A;
    --ink-soft: #55605C;
    --line: rgba(35,40,42,0.14);
    --gold: #B98A34;
    --gold-soft: rgba(185,138,52,0.16);
    --sage: #4C7A63;
    --sage-soft: rgba(76,122,99,0.14);
    --rust: #A85630;
    --rust-soft: rgba(168,86,48,0.14);
    --radius: 10px;
    --shadow: 0 1px 0 rgba(35,40,42,0.06);
    font-family: 'IBM Plex Sans', -apple-system, sans-serif;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--paper); color:var(--ink); }
  .app{ max-width:1040px; margin:0 auto; padding:0 0 3rem; }
  ::selection{ background:var(--gold-soft); }
  button{ font-family:inherit; cursor:pointer; }
  input, select{ font-family:inherit; }
  input:focus-visible, select:focus-visible, button:focus-visible{
    outline:2px solid var(--gold); outline-offset:1px;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001s !important; transition-duration:0.001s !important; }
  }

  /* ---------- header / masthead ---------- */
  .masthead{
    background:var(--board); color:var(--paper-2);
    padding:1.75rem 1.5rem 1.5rem;
    border-radius:0 0 16px 16px;
    position:relative;
    background-image: repeating-linear-gradient(to bottom, transparent 0 38px, rgba(255,255,255,0.035) 38px 39px);
  }
  .masthead h1{
    font-family:'Fraunces', serif; font-weight:600; font-size:1.7rem;
    margin:0 0 0.15rem; letter-spacing:0.2px;
  }
  .masthead p.tag{
    margin:0; font-size:0.85rem; color:rgba(245,240,227,0.62);
    font-family:'IBM Plex Mono', monospace;
  }
  .summary-row{
    display:flex; gap:0.6rem; flex-wrap:wrap; margin-top:1.15rem;
  }
  .sum-chip{
    background:rgba(255,255,255,0.07); border:0.5px solid rgba(255,255,255,0.14);
    border-radius:8px; padding:0.5rem 0.8rem; min-width:118px;
  }
  .sum-chip .num{
    font-family:'IBM Plex Mono', monospace; font-size:1.05rem; font-weight:500;
    display:block; color:#F5EFD9;
  }
  .sum-chip .lbl{ font-size:0.72rem; color:rgba(245,240,227,0.58); }

  /* ---------- layout ---------- */
  .board{ display:grid; grid-template-columns:250px 1fr; gap:1.25rem; padding:1.25rem 1.25rem 0; align-items:start; }
  @media (max-width:760px){ .board{ grid-template-columns:1fr; } }

  /* ---------- sidebar ---------- */
  .sidebar{ position:sticky; top:0.75rem; }
  .search-box{
    width:100%; padding:0.5rem 0.65rem; border:1px solid var(--line);
    border-radius:8px; background:var(--paper-2); font-size:0.85rem; margin-bottom:0.6rem;
    color:var(--ink);
  }
  .student-list{ display:flex; flex-direction:column; gap:0.4rem; }
  .student-card{
    display:flex; align-items:center; justify-content:space-between; gap:0.5rem;
    background:var(--paper-2); border:1px solid var(--line); border-radius:9px;
    padding:0.6rem 0.7rem; text-align:left; width:100%; font-size:0.88rem; color:var(--ink);
  }
  .student-card:hover{ border-color:var(--gold); }
  .student-card.active{ background:var(--gold-soft); border-color:var(--gold); }
  .student-card .name{ font-weight:500; }
  .student-card .plan{ display:block; font-size:0.72rem; color:var(--ink-soft); font-family:'IBM Plex Mono', monospace; margin-top:1px; }
  .dot{ width:9px; height:9px; border-radius:50%; flex:none; }
  .dot.due{ background:var(--rust); }
  .dot.paid{ background:var(--sage); }

  .add-student-btn{
    width:100%; margin-top:0.6rem; padding:0.55rem; border:1.5px dashed var(--line);
    border-radius:9px; background:transparent; color:var(--ink-soft); font-size:0.85rem;
  }
  .add-student-btn:hover{ border-color:var(--gold); color:var(--ink); }

  .new-student-form{
    background:var(--paper-2); border:1px solid var(--line); border-radius:9px;
    padding:0.7rem; margin-top:0.6rem; display:flex; flex-direction:column; gap:0.45rem;
  }
  .new-student-form input, .new-student-form select{
    padding:0.4rem 0.5rem; border:1px solid var(--line); border-radius:6px; font-size:0.83rem;
    background:#fff; color:var(--ink);
  }
  .form-row{ display:flex; gap:0.4rem; }
  .form-row > *{ flex:1; min-width:0; }
  .form-actions{ display:flex; gap:0.4rem; margin-top:0.15rem; }
  .btn{
    padding:0.4rem 0.75rem; border-radius:6px; border:1px solid var(--line);
    background:#fff; font-size:0.82rem; color:var(--ink);
  }
  .btn:hover{ border-color:var(--gold); }
  .btn.primary{ background:var(--board); color:var(--paper-2); border-color:var(--board); }
  .btn.primary:hover{ background:var(--board-2); }
  .btn.danger-ghost{ color:var(--rust); }
  .err-text{ font-size:0.76rem; color:var(--rust); }

  /* ---------- detail panel ---------- */
  .detail{ min-width:0; }
  .empty-state{
    background:var(--paper-2); border:1px dashed var(--line); border-radius:12px;
    padding:2.5rem 1.5rem; text-align:center; color:var(--ink-soft); font-size:0.95rem;
  }
  .student-header{
    display:flex; justify-content:space-between; align-items:flex-start; gap:0.75rem;
    margin-bottom:0.9rem; flex-wrap:wrap;
  }
  .student-header h2{
    font-family:'Fraunces', serif; font-weight:600; font-size:1.4rem; margin:0 0 0.2rem;
  }
  .plan-line{ font-family:'IBM Plex Mono', monospace; font-size:0.83rem; color:var(--ink-soft); }
  .header-actions{ display:flex; gap:0.4rem; flex-wrap:wrap; }

  .plan-edit{
    background:var(--paper-2); border:1px solid var(--line); border-radius:9px;
    padding:0.75rem; margin-bottom:0.9rem; display:flex; gap:0.5rem; flex-wrap:wrap; align-items:flex-end;
  }
  .plan-edit label{ display:block; font-size:0.72rem; color:var(--ink-soft); margin-bottom:0.2rem; }
  .plan-edit input, .plan-edit select{
    padding:0.4rem 0.5rem; border:1px solid var(--line); border-radius:6px; font-size:0.85rem; background:#fff; width:110px;
  }

  .cycle-card{
    background:var(--paper-2); border:1px solid var(--line); border-radius:12px;
    padding:0.9rem 1rem 1rem; margin-bottom:0.85rem;
  }
  .cycle-top{
    display:flex; align-items:center; gap:0.6rem; flex-wrap:wrap; margin-bottom:0.7rem;
  }
  .cycle-label-input{
    font-family:'Fraunces', serif; font-weight:600; font-size:1.05rem; border:none;
    background:transparent; color:var(--ink); padding:0.1rem 0.2rem; border-radius:5px; flex:1; min-width:120px;
  }
  .cycle-label-input:hover, .cycle-label-input:focus{ background:rgba(255,255,255,0.6); }
  .pay-toggle{
    border:1px solid var(--line); border-radius:20px; padding:0.28rem 0.75rem; font-size:0.78rem;
    font-weight:500; display:flex; align-items:center; gap:0.35rem; background:#fff;
  }
  .pay-toggle.paid{ background:var(--sage-soft); border-color:var(--sage); color:#2E4B3B; }
  .pay-toggle.due{ background:var(--rust-soft); border-color:var(--rust); color:#6E3620; }
  .pay-toggle .pdot{ width:7px; height:7px; border-radius:50%; }
  .pay-toggle.paid .pdot{ background:var(--sage); }
  .pay-toggle.due .pdot{ background:var(--rust); }

  .amount-tag{
    font-family:'IBM Plex Mono', monospace; font-size:0.8rem; color:var(--ink-soft);
    background:rgba(35,40,42,0.05); padding:0.28rem 0.6rem; border-radius:20px;
  }
  .icon-btn{
    border:none; background:transparent; color:var(--ink-soft); font-size:0.95rem;
    padding:0.2rem 0.35rem; border-radius:6px; line-height:1;
  }
  .icon-btn:hover{ background:rgba(35,40,42,0.08); color:var(--rust); }

  .cycle-note{ font-size:0.78rem; color:var(--ink-soft); font-style:italic; margin:-0.3rem 0 0.6rem; }

  .lesson-grid{ display:flex; flex-wrap:wrap; gap:0.4rem; margin-bottom:0.55rem; }
  .lesson-chip{
    display:flex; align-items:center; gap:0.4rem; background:#fff; border:1px solid var(--line);
    border-radius:20px; padding:0.25rem 0.4rem 0.25rem 0.25rem;
  }
  .stamp{
    width:22px; height:22px; border-radius:50%; border:1.5px solid var(--line); background:#fff;
    display:flex; align-items:center; justify-content:center; flex:none; padding:0; position:relative;
  }
  .stamp svg{ width:13px; height:13px; opacity:0; transform:scale(0.5) rotate(-8deg); transition:opacity .15s ease, transform .15s ease; }
  .stamp.done{ background:var(--sage-soft); border-color:var(--sage); }
  .stamp.done svg{ opacity:1; transform:scale(1) rotate(-6deg); }
  .lesson-date{
    border:none; background:transparent; width:56px; font-family:'IBM Plex Mono', monospace;
    font-size:0.82rem; color:var(--ink); padding:0.1rem 0.15rem; border-radius:4px;
  }
  .lesson-date:hover, .lesson-date:focus{ background:var(--paper); }
  .lesson-date::placeholder{ color:var(--ink-soft); opacity:0.55; }
  .lesson-remove{
    border:none; background:transparent; color:var(--ink-soft); opacity:0; width:16px; height:16px;
    display:flex; align-items:center; justify-content:center; font-size:0.85rem; border-radius:50%; flex:none;
  }
  .lesson-chip:hover .lesson-remove{ opacity:0.6; }
  .lesson-remove:hover{ opacity:1 !important; color:var(--rust); background:rgba(35,40,42,0.08); }

  .add-lesson-chip{
    display:flex; align-items:center; gap:0.3rem; border:1.5px dashed var(--line); border-radius:20px;
    padding:0.28rem 0.7rem; background:transparent; color:var(--ink-soft); font-size:0.8rem;
  }
  .add-lesson-chip:hover{ border-color:var(--gold); color:var(--ink); }

  .cycle-progress{ font-size:0.75rem; color:var(--ink-soft); font-family:'IBM Plex Mono', monospace; }

  .add-cycle-btn{
    width:100%; padding:0.6rem; border:1.5px dashed var(--line); border-radius:10px;
    background:transparent; color:var(--ink-soft); font-size:0.85rem; margin-top:0.2rem;
  }
  .add-cycle-btn:hover{ border-color:var(--gold); color:var(--ink); }

  .confirm-row{ display:flex; align-items:center; gap:0.4rem; }
  .save-flash{
    position:fixed; bottom:14px; right:14px; background:var(--board); color:var(--paper-2);
    font-size:0.78rem; padding:0.4rem 0.75rem; border-radius:8px; opacity:0; transform:translateY(6px);
    transition:opacity .2s ease, transform .2s ease; pointer-events:none; font-family:'IBM Plex Mono', monospace;
    z-index:50;
  }
  .save-flash.show{ opacity:1; transform:translateY(0); }

  .footer-note{ text-align:center; font-size:0.75rem; color:var(--ink-soft); padding:1.5rem 1rem 0; }
  .footer-note button{ background:none; border:none; text-decoration:underline; color:var(--ink-soft); font-size:0.75rem; padding:0; }
  .footer-note button:hover{ color:var(--rust); }
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="save-flash" id="saveFlash">saved</div>

<script>
const STORAGE_KEY = 'ledger-students';

const SEED_STUDENTS = [
  {
    id:'example', name:'Example student', rate:100, currency:'EUR', lessonsPerCycle:8,
    cycles:[
      { id:'ex1', label:'First block', paid:false, note:'',
        lessons:[{date:'',done:false},{date:'',done:false},{date:'',done:false},{date:'',done:false},
                 {date:'',done:false},{date:'',done:false},{date:'',done:false},{date:'',done:false}] }
    ]
  }
];

let students = [];
let selectedId = null;
let filterText = '';
let addingStudent = false;
let editingPlanId = null;
let confirmingDeleteStudent = null;
let confirmingDeleteCycle = null;
let confirmingImport = false;
let importError = '';
let pendingImportFile = null;
let saveTimer = null;

function uid(){ return Math.random().toString(36).slice(2,9); }

let storageBlocked = false;

function loadStudents(){
  try{
    const raw = window.localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
    return null;
  }catch(e){ storageBlocked = true; return null; }
}

function persist(){
  try{
    window.localStorage.setItem(STORAGE_KEY, JSON.stringify(students));
    flashSaved();
  }catch(e){ storageBlocked = true; render(); }
}

function exportData(){
  const blob = new Blob([JSON.stringify(students, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = 'lesson-ledger-backup-'+stamp+'.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function importData(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      if(!Array.isArray(parsed)) throw new Error('not an array');
      students = parsed;
      selectedId = students.length ? students[0].id : null;
      confirmingImport = false;
      render();
      persist();
    }catch(e){
      importError = 'That file could not be read as a ledger backup.';
      render();
    }
  };
  reader.readAsText(file);
}

function flashSaved(){
  const el = document.getElementById('saveFlash');
  el.classList.add('show');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>el.classList.remove('show'), 900);
}

function fmtMoney(amount, currency){
  const symbols = { EUR:'€', USD:'$', GBP:'£', UAH:'\u20B4', RON:'lei', MDL:'lei' };
  const sym = symbols[currency] || (currency+' ');
  const n = Number(amount)||0;
  if(currency==='RON' || currency==='MDL') return n.toLocaleString()+' '+sym;
  return sym+n.toLocaleString();
}

function computeTotals(){
  const due = {};
  let dueCycles = 0;
  students.forEach(s=>{
    s.cycles.forEach(c=>{
      if(!c.paid){
        due[s.currency] = (due[s.currency]||0) + Number(s.rate||0);
        dueCycles++;
      }
    });
  });
  return { due, dueCycles };
}

function studentHasDue(s){ return s.cycles.some(c=>!c.paid); }

function render(){
  const app = document.getElementById('app');
  const totals = computeTotals();
  const dueChips = Object.keys(totals.due).map(cur=>
    `<div class="sum-chip"><span class="num">${fmtMoney(totals.due[cur],cur)}</span><span class="lbl">due in ${cur}</span></div>`
  ).join('');

  app.innerHTML = `
    <div class="masthead">
      <h1>Lesson ledger</h1>
      <p class="tag">payments and lesson tracking</p>
      <div class="summary-row">
        <div class="sum-chip"><span class="num">${students.length}</span><span class="lbl">students</span></div>
        <div class="sum-chip"><span class="num">${totals.dueCycles}</span><span class="lbl">blocks awaiting payment</span></div>
        ${dueChips}
      </div>
    </div>
    ${storageBlocked ? `<div style="background:var(--rust-soft);color:#6E3620;border:1px solid var(--rust);border-radius:8px;padding:0.6rem 0.9rem;margin:0.9rem 1.25rem 0;font-size:0.82rem;">This browser is blocking local storage, so changes here won't be saved once you close the page. Try a normal (non-private) browser tab, or use "Export backup" below before you close it.</div>` : ''}
    <div class="board">
      ${renderSidebar()}
      <div class="detail">${renderDetail()}</div>
    </div>
    <div class="footer-note">
      Data is saved in this browser, on this device, as a file only you have.
      <button id="exportBtn" type="button">Export backup (.json)</button>
      ·
      <button id="importBtn" type="button">Import backup</button>
      ·
      <button id="resetBtn" type="button">Clear all data and start over</button>
      <input type="file" id="importFile" accept="application/json" style="display:none;">
      ${importError ? `<div class="err-text" style="margin-top:0.4rem;">${escapeHtml(importError)}</div>` : ''}
      ${confirmingImport ? `<div class="confirm-row" style="justify-content:center;margin-top:0.4rem;"><span style="color:var(--rust);">Replace all current data with this backup?</span><button class="btn danger-ghost" id="confirmImportBtn" type="button">Yes, replace</button><button class="btn" id="cancelImportBtn" type="button">Cancel</button></div>` : ''}
    </div>
  `;
  attachHandlers();
}

function renderSidebar(){
  const list = students
    .filter(s=>s.name.toLowerCase().includes(filterText.toLowerCase()))
    .map(s=>{
      const due = studentHasDue(s);
      return `
      <button class="student-card ${s.id===selectedId?'active':''}" data-select="${s.id}" type="button">
        <span>
          <span class="name">${escapeHtml(s.name)}</span>
          <span class="plan">${fmtMoney(s.rate,s.currency)} / ${s.lessonsPerCycle} lessons</span>
        </span>
        <span class="dot ${due?'due':'paid'}" title="${due?'payment due':'up to date'}"></span>
      </button>`;
    }).join('');

  return `
    <div class="sidebar">
      <input class="search-box" id="searchBox" type="text" placeholder="Search students" value="${escapeHtml(filterText)}">
      <div class="student-list">${list || '<p style="font-size:0.82rem;color:var(--ink-soft);padding:0.4rem;">No students match.</p>'}</div>
      ${addingStudent ? renderNewStudentForm() : `<button class="add-student-btn" id="addStudentBtn" type="button">+ Add student</button>`}
    </div>
  `;
}

function renderNewStudentForm(){
  return `
    <div class="new-student-form">
      <input id="nsName" type="text" placeholder="Student name">
      <div class="form-row">
        <input id="nsRate" type="number" min="0" step="0.01" placeholder="Rate">
        <input id="nsCurrency" list="curList" placeholder="Currency" value="EUR">
        <datalist id="curList">
          <option value="EUR"><option value="USD"><option value="GBP">
          <option value="UAH"><option value="RON"><option value="MDL">
        </datalist>
      </div>
      <input id="nsLessons" type="number" min="1" step="1" placeholder="Lessons per paid block" value="4">
      <div id="nsErr" class="err-text" style="display:none;"></div>
      <div class="form-actions">
        <button class="btn primary" id="nsSave" type="button">Add</button>
        <button class="btn" id="nsCancel" type="button">Cancel</button>
      </div>
    </div>
  `;
}

function renderDetail(){
  const s = students.find(x=>x.id===selectedId);
  if(!s){
    return `<div class="empty-state">Pick a student on the left, or add a new one, to see their lesson blocks and payments.</div>`;
  }
  const planEditing = editingPlanId===s.id;
  const cycles = s.cycles.map(c=>renderCycle(s,c)).join('');
  const confirmingThis = confirmingDeleteStudent===s.id;

  return `
    <div class="student-header">
      <div>
        <h2>${escapeHtml(s.name)}</h2>
        <div class="plan-line">${fmtMoney(s.rate,s.currency)} every ${s.lessonsPerCycle} lessons</div>
      </div>
      <div class="header-actions">
        <button class="btn" data-toggle-plan="${s.id}" type="button">${planEditing?'Close':'Edit plan'}</button>
        ${confirmingThis
          ? `<span class="confirm-row"><span style="font-size:0.8rem;color:var(--rust);">Delete ${escapeHtml(s.name)}?</span><button class="btn danger-ghost" data-confirm-del-student="${s.id}" type="button">Yes, delete</button><button class="btn" data-cancel-del-student type="button">Cancel</button></span>`
          : `<button class="btn danger-ghost" data-ask-del-student="${s.id}" type="button">Delete student</button>`}
      </div>
    </div>
    ${planEditing ? renderPlanEdit(s) : ''}
    ${cycles}
    <button class="add-cycle-btn" data-add-cycle="${s.id}" type="button">+ Add payment block</button>
  `;
}

function renderPlanEdit(s){
  return `
    <div class="plan-edit">
      <div><label>Name</label><input data-plan-field="name" data-plan-id="${s.id}" type="text" value="${escapeHtml(s.name)}"></div>
      <div><label>Rate</label><input data-plan-field="rate" data-plan-id="${s.id}" type="number" min="0" step="0.01" value="${s.rate}" style="width:90px;"></div>
      <div><label>Currency</label><input data-plan-field="currency" data-plan-id="${s.id}" list="curList2" type="text" value="${s.currency}" style="width:80px;">
        <datalist id="curList2"><option value="EUR"><option value="USD"><option value="GBP"><option value="UAH"><option value="RON"><option value="MDL"></datalist>
      </div>
      <div><label>Lessons / block</label><input data-plan-field="lessonsPerCycle" data-plan-id="${s.id}" type="number" min="1" step="1" value="${s.lessonsPerCycle}" style="width:90px;"></div>
    </div>
  `;
}

function renderCycle(s,c){
  const doneCount = c.lessons.filter(l=>l.done).length;
  const total = c.lessons.length;
  const confirmingThis = confirmingDeleteCycle===c.id;
  const lessonChips = c.lessons.map((l,idx)=>`
    <span class="lesson-chip">
      <button class="stamp ${l.done?'done':''}" data-toggle-lesson="${s.id}|${c.id}|${idx}" type="button" aria-label="Mark lesson done">
        <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 10.5L7.5 15L17 4" stroke="#4C7A63" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <input class="lesson-date" data-edit-lesson="${s.id}|${c.id}|${idx}" type="text" value="${escapeHtml(l.date)}" placeholder="DD.MM">
      <button class="lesson-remove" data-remove-lesson="${s.id}|${c.id}|${idx}" type="button" aria-label="Remove lesson">×</button>
    </span>
  `).join('');

  return `
    <div class="cycle-card">
      <div class="cycle-top">
        <input class="cycle-label-input" data-edit-label="${s.id}|${c.id}" type="text" value="${escapeHtml(c.label)}">
        <button class="pay-toggle ${c.paid?'paid':'due'}" data-toggle-paid="${s.id}|${c.id}" type="button">
          <span class="pdot"></span>${c.paid?'Paid':'Due'}
        </button>
        <span class="amount-tag">${fmtMoney(s.rate,s.currency)}</span>
        ${confirmingThis
          ? `<span class="confirm-row"><span style="font-size:0.76rem;color:var(--rust);">Delete block?</span><button class="icon-btn" data-confirm-del-cycle="${s.id}|${c.id}" type="button" style="color:var(--rust);">Yes</button><button class="icon-btn" data-cancel-del-cycle type="button">No</button></span>`
          : `<button class="icon-btn" data-ask-del-cycle="${s.id}|${c.id}" type="button" title="Delete block">Delete</button>`}
      </div>
      ${c.note ? `<div class="cycle-note">${escapeHtml(c.note)}</div>` : ''}
      <div class="lesson-grid">${lessonChips}</div>
      <div style="display:flex; justify-content:space-between; align-items:center; gap:0.5rem; flex-wrap:wrap;">
        <button class="add-lesson-chip" data-add-lesson="${s.id}|${c.id}" type="button">+ lesson</button>
        <span class="cycle-progress">${doneCount} / ${total || s.lessonsPerCycle} done</span>
      </div>
    </div>
  `;
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function attachHandlers(){
  const searchBox = document.getElementById('searchBox');
  if(searchBox){
    searchBox.addEventListener('input', e=>{
      filterText = e.target.value;
      render();
      const ns = document.getElementById('searchBox');
      if(ns){
        ns.focus();
        const pos = ns.value.length;
        ns.setSelectionRange(pos,pos);
      }
    });
  }
  document.querySelectorAll('[data-select]').forEach(el=>{
    el.addEventListener('click', ()=>{ selectedId = el.getAttribute('data-select'); editingPlanId=null; confirmingDeleteStudent=null; confirmingDeleteCycle=null; render(); });
  });

  const addBtn = document.getElementById('addStudentBtn');
  if(addBtn) addBtn.addEventListener('click', ()=>{ addingStudent = true; render(); document.getElementById('nsName').focus(); });

  const nsCancel = document.getElementById('nsCancel');
  if(nsCancel) nsCancel.addEventListener('click', ()=>{ addingStudent=false; render(); });

  const nsSave = document.getElementById('nsSave');
  if(nsSave) nsSave.addEventListener('click', ()=>{
    const name = document.getElementById('nsName').value.trim();
    const rate = parseFloat(document.getElementById('nsRate').value);
    const currency = document.getElementById('nsCurrency').value.trim().toUpperCase() || 'EUR';
    const lessonsPerCycle = parseInt(document.getElementById('nsLessons').value,10);
    const errEl = document.getElementById('nsErr');
    if(!name){ errEl.textContent='Enter a student name.'; errEl.style.display='block'; return; }
    if(isNaN(rate) || rate<0){ errEl.textContent='Enter a valid rate.'; errEl.style.display='block'; return; }
    if(!lessonsPerCycle || lessonsPerCycle<1){ errEl.textContent='Enter lessons per block (at least 1).'; errEl.style.display='block'; return; }
    const s = { id:uid(), name, rate, currency, lessonsPerCycle, cycles:[] };
    students.push(s);
    selectedId = s.id;
    addingStudent = false;
    render();
    persist();
  });

  document.querySelectorAll('[data-toggle-plan]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.getAttribute('data-toggle-plan');
      editingPlanId = editingPlanId===id ? null : id;
      render();
    });
  });

  document.querySelectorAll('[data-plan-field]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const id = el.getAttribute('data-plan-id');
      const field = el.getAttribute('data-plan-field');
      const s = students.find(x=>x.id===id);
      if(!s) return;
      if(field==='rate' || field==='lessonsPerCycle'){
        const val = field==='rate' ? parseFloat(el.value) : parseInt(el.value,10);
        if(!isNaN(val) && val>=0) s[field]=val;
      } else if(field==='currency'){
        s.currency = el.value.trim().toUpperCase() || s.currency;
      } else {
        s.name = el.value.trim() || s.name;
      }
      render();
      persist();
    });
  });

  document.querySelectorAll('[data-ask-del-student]').forEach(el=>{
    el.addEventListener('click', ()=>{ confirmingDeleteStudent = el.getAttribute('data-ask-del-student'); render(); });
  });
  document.querySelectorAll('[data-cancel-del-student]').forEach(el=>{
    el.addEventListener('click', ()=>{ confirmingDeleteStudent = null; render(); });
  });
  document.querySelectorAll('[data-confirm-del-student]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.getAttribute('data-confirm-del-student');
      students = students.filter(x=>x.id!==id);
      if(selectedId===id) selectedId = students.length ? students[0].id : null;
      confirmingDeleteStudent = null;
      render();
      persist();
    });
  });

  document.querySelectorAll('[data-add-cycle]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.getAttribute('data-add-cycle');
      const s = students.find(x=>x.id===id);
      if(!s) return;
      const lessons = Array.from({length:s.lessonsPerCycle}, ()=>({date:'',done:false}));
      s.cycles.push({ id:uid(), label:'New block', paid:false, note:'', lessons });
      render();
      persist();
    });
  });

  document.querySelectorAll('[data-ask-del-cycle]').forEach(el=>{
    el.addEventListener('click', ()=>{ confirmingDeleteCycle = el.getAttribute('data-ask-del-cycle').split('|')[1]; render(); });
  });
  document.querySelectorAll('[data-cancel-del-cycle]').forEach(el=>{
    el.addEventListener('click', ()=>{ confirmingDeleteCycle = null; render(); });
  });
  document.querySelectorAll('[data-confirm-del-cycle]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const [sid,cid] = el.getAttribute('data-confirm-del-cycle').split('|');
      const s = students.find(x=>x.id===sid);
      if(s) s.cycles = s.cycles.filter(c=>c.id!==cid);
      confirmingDeleteCycle = null;
      render();
      persist();
    });
  });

  document.querySelectorAll('[data-edit-label]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const [sid,cid] = el.getAttribute('data-edit-label').split('|');
      const s = students.find(x=>x.id===sid);
      const c = s && s.cycles.find(y=>y.id===cid);
      if(c) c.label = el.value.trim() || c.label;
      persist();
    });
  });

  document.querySelectorAll('[data-toggle-paid]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const [sid,cid] = el.getAttribute('data-toggle-paid').split('|');
      const s = students.find(x=>x.id===sid);
      const c = s && s.cycles.find(y=>y.id===cid);
      if(c) c.paid = !c.paid;
      render();
      persist();
    });
  });

  document.querySelectorAll('[data-toggle-lesson]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const [sid,cid,idx] = el.getAttribute('data-toggle-lesson').split('|');
      const s = students.find(x=>x.id===sid);
      const c = s && s.cycles.find(y=>y.id===cid);
      if(c && c.lessons[idx]) c.lessons[idx].done = !c.lessons[idx].done;
      render();
      persist();
    });
  });

  document.querySelectorAll('[data-edit-lesson]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const [sid,cid,idx] = el.getAttribute('data-edit-lesson').split('|');
      const s = students.find(x=>x.id===sid);
      const c = s && s.cycles.find(y=>y.id===cid);
      if(c && c.lessons[idx]) c.lessons[idx].date = el.value.trim();
      persist();
    });
  });

  document.querySelectorAll('[data-remove-lesson]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const [sid,cid,idx] = el.getAttribute('data-remove-lesson').split('|');
      const s = students.find(x=>x.id===sid);
      const c = s && s.cycles.find(y=>y.id===cid);
      if(c) c.lessons.splice(idx,1);
      render();
      persist();
    });
  });

  document.querySelectorAll('[data-add-lesson]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const [sid,cid] = el.getAttribute('data-add-lesson').split('|');
      const s = students.find(x=>x.id===sid);
      const c = s && s.cycles.find(y=>y.id===cid);
      if(c){ c.lessons.push({date:'',done:false}); }
      render();
      persist();
      const inputs = document.querySelectorAll(`[data-edit-lesson^="${sid}|${cid}|"]`);
      if(inputs.length) inputs[inputs.length-1].focus();
    });
  });

  const exportBtn = document.getElementById('exportBtn');
  if(exportBtn) exportBtn.addEventListener('click', exportData);

  const importBtn = document.getElementById('importBtn');
  const importFile = document.getElementById('importFile');
  if(importBtn && importFile) importBtn.addEventListener('click', ()=>importFile.click());
  if(importFile) importFile.addEventListener('change', ()=>{
    if(importFile.files && importFile.files[0]){
      pendingImportFile = importFile.files[0];
      importError = '';
      confirmingImport = true;
      render();
    }
  });
  const confirmImportBtn = document.getElementById('confirmImportBtn');
  if(confirmImportBtn) confirmImportBtn.addEventListener('click', ()=>{
    if(pendingImportFile) importData(pendingImportFile);
    pendingImportFile = null;
  });
  const cancelImportBtn = document.getElementById('cancelImportBtn');
  if(cancelImportBtn) cancelImportBtn.addEventListener('click', ()=>{
    pendingImportFile = null;
    confirmingImport = false;
    render();
  });

  const resetBtn = document.getElementById('resetBtn');
  if(resetBtn) resetBtn.addEventListener('click', ()=>{
    if(resetBtn.dataset.armed==='1'){
      students = JSON.parse(JSON.stringify(SEED_STUDENTS));
      selectedId = students.length ? students[0].id : null;
      render();
      persist();
    } else {
      resetBtn.dataset.armed = '1';
      resetBtn.textContent = 'Click again to confirm - this erases everything';
      setTimeout(()=>{ resetBtn.dataset.armed='0'; resetBtn.textContent='Clear all data and start over'; }, 4000);
    }
  });
}

function init(){
  const loaded = loadStudents();
  if(loaded && Array.isArray(loaded) && loaded.length){
    students = loaded;
  } else {
    students = JSON.parse(JSON.stringify(SEED_STUDENTS));
    persist();
  }
  selectedId = students.length ? students[0].id : null;
  render();
}

init();
</script>
</body>
</html>
